name: Publish Fengsheng MCP
on:
  push:
    tags: ['fengsheng-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify release and publish its remote endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fengsheng-v$(jq -r .version server.json)"
          test "$(jq -r .version server.json)" = "$(jq -r .version .claude-plugin/plugin.json)"
          node --test test/fengsheng.test.mjs
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.15/$archive"
          echo "8beca8143ae8a034c87c99a57e8cb1b6c2cee7874fcf8a20a8adbda84b291b5e  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
